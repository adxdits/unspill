name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal scanner)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/unspill
      - name: Smoke test built CLI
        shell: bash
        run: |
          binary=./unspill
          if [[ "$RUNNER_OS" == Windows ]]; then binary=./unspill.exe; fi
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          "$binary" scan --path ./testdata/demo --format json --fail-on none > "$temp/smoke.json"
          python -c 'import json, sys; report = json.load(open(sys.argv[1])); assert report["status"] == "complete"; assert len(report["findings"]) == 4; assert all(item["value"] == "[REDACTED]" for item in report["findings"])' "$temp/smoke.json"
          exit_code=0
          "$binary" scan --path ./testdata/demo --format json > "$temp/threshold.json" || exit_code=$?
          [[ "$exit_code" == 1 ]]

  security:
    name: Vulnerabilities and parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check supported platforms
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" govulncheck ./...
          done
      - name: Fuzz adapters
        run: go test ./internal/agents -run '^$' -fuzz '^FuzzParse$' -fuzztime=15s -parallel=4