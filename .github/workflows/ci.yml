name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal scanner)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/unspill